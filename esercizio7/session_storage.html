Lo scopo di questo task è di salvare tutti i dati di un form nel session storage. -Fai in modo che nello span venga inserito il testo che si è inserito nell'input nome -Fai in modo che questi dati si salvino nel session storage

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .form{
            display: flex;
            flex-direction: column;
            max-width: 300px;
            gap: 16px;
            margin-bottom: 16px
        };
    </style>
</head>
<body>
    <h1>Il form di <span class="title-name"></span></h1>
    <div class="form">
        <label for="email">Email</label>
        <input type="email" name="email" class="email" placeholder="email">
        <label for="firstname">Name</label>
        <input type="text" name="firstname" class="firstname" placeholder="firstname">
        <label for="lastname">Surname</label>
        <input type="text" name="lastname" class="lastname" placeholder="lastname">
    </div>
    <button class="btn">Salva</button>
    <p class="printedform"></p>
    <script>

        // Selezioniamo gli elementi del DOM necessari
        const inputName = document.querySelector('.firstname');
        const inputEmail = document.querySelector('.email');
        const inputLastname = document.querySelector('.lastname');
        const spanName = document.querySelector('.title-name');
        const btnSave = document.querySelector('.btn');

        // Funzione per caricare i dati salvati all'avvio della pagina
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = sessionStorage.getItem('email');
            const savedFirstname = sessionStorage.getItem('firstname');
            const savedLastname = sessionStorage.getItem('lastname');

            if (savedEmail) inputEmail.value = savedEmail;
            if (savedFirstname) {
                inputName.value = savedFirstname;
                spanName.textContent = savedFirstname; // Inserisce il nome nello span all'avvio
            }
            if (savedLastname) inputLastname.value = savedLastname;
        });

        // Aggiorna lo span in tempo reale mentre l'utente digita il nome
        inputName.addEventListener('input', () => {
            spanName.textContent = inputName.value;
        });

        // Salva tutti i dati nel session storage al click del bottone "Salva"
        btnSave.addEventListener('click', () => {
            sessionStorage.setItem('email', inputEmail.value);
            sessionStorage.setItem('firstname', inputName.value);
            sessionStorage.setItem('lastname', inputLastname.value);
            
            alert('Dati salvati correttamente nel session storage!');
        });

    </script>
</body>

</html>

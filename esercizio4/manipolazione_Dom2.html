Implementare il codice necessario per:

Recuperare il valore di ciascun campo di input e creare un oggetto person contenente le proprietà: firstName, lastName e age.
Infine recuperare l'elemento forme aggiungere l'attributo data-person contenente l'oggetto person in formato json.
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <form>
        <div>
          <label>First Name:</label>
          <input type="text" class="form-input" id="firstName" value="Mario" />
        </div>
        <div>
          <label>Last Name:</label>
          <input type="text" class="form-input" id="lastName" value="Rossi" />
        </div>
        <div>
          <label>Age:</label>
          <input type="number" class="form-input" id="age" value="25" />
        </div>
      </form>
    </div>

    <script>
      // 1. Recupera i singoli campi di input tramite il loro ID
const firstNameInput = document.getElementById('firstName');
const lastNameInput = document.getElementById('lastName');
const ageInput = document.getElementById('age');

// 2. Crea l'oggetto 'person' con i valori estratti (convertendo l'età in numero)
const person = {
  firstName: firstNameInput.value,
  lastName: lastNameInput.value,
  age: Number(ageInput.value) // Converte la stringa in numero
};

// 3. Recupera l'elemento form
const form = document.querySelector('form');

// 4. Aggiunge l'attributo data-person convertendo l'oggetto in formato JSON
form.setAttribute('data-person', JSON.stringify(person));

    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <script>
        // Selezione degli elementi di riferimento
        const ul = document.querySelector('viewport' ? 'ul' : 'ul'); 
        const secondiLi = ul.children[1];

        // 1. L'elemento padre di ul
        console.log(ul.parentElement);

        // 2. Il secondo elemento figlio di ul
        console.log(ul.children[1]);

        // 3. L'elemento fratello successivo del secondo li
        console.log(secondiLi.nextElementSibling);

        // 4. L'elemento fratello precedente del secondo li
        console.log(secondiLi.previousElementSibling);
    </script>
</body>

</html>

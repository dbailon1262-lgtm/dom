Crea uno script che:

Al click del bottone inserisca la modalità dark
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .theme {
        background-color: black;
        color: white;
      }
    </style>

  </head>
  <body>
    <h1>Dark Mode</h1>
    <div>
      <button class="btn">Dark Mode</button>
    </div>
    <script>

        // 1. Seleccionamos el botón usando su clase '.btn'
            const boton = document.querySelector('.btn');

        // 2. Escuchamos el evento 'click' en el botón
            boton.addEventListener('click', () => {

        // 3. Añadimos o quitamos la clase '.theme' al elemento <body>
            document.body.classList.toggle('theme');
        
            });

    </script>
  </body>
</html>
